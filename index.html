<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle Chess 2D - Medieval Fantasia</title>
<style>
:root{color-scheme:dark}
html,body{height:100%}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box;background:#0d0f14;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none}
#top-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:min(640px,calc(100vw - 20px));box-sizing:border-box;margin-bottom:12px;background:#161922;padding:10px 16px;border-radius:10px;border:1px solid #2a2f3d;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h1{margin:0;font-size:18px;color:#f1c40f;text-shadow:0 0 10px rgba(241,196,15,.4)}
#status{font-weight:bold;font-size:15px;color:#2ecc71}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{background:#2c3e50;color:#fff;border:1px solid #4a627a;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px;transition:.2s}
button:hover{background:#34495e;border-color:#f1c40f}
button:focus-visible{outline:2px solid #f1c40f;outline-offset:2px}
canvas{width:min(640px,calc(100vw - 20px),calc(100dvh - 150px));height:auto;aspect-ratio:1;border:4px solid #2a2f3d;border-radius:8px;box-shadow:0 0 50px rgba(0,0,0,.8);cursor:pointer;touch-action:manipulation}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
<div id="top-bar">
  <div><h1>⚔️ XADREZ ARCADE 2D</h1><div id="status">Vez das Brancas</div></div>
  <div class="btns">
    <button id="modeBtn" onclick="toggleMode()">Modo: Vs. Bot (IA)</button>
    <button onclick="resetGame()">Reiniciar</button>
  </div>
</div>
<canvas id="board" width="640" height="640"></canvas>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const SQ_SIZE = 80;
const files = ['a','b','c','d','e','f','g','h'];

const game = new Chess();
let vsBot = true, selectedSq = null, validMoves = [], isAnimating = false, botTimer = null;
let shakeTime = 0, shakeIntensity = 0;
let screenFlash = {alpha:0, color:'#ffffff'};
let particles = [], activeEffects = [], movingPiece = null;

// \uFE0E força glifo de texto (evita virar emoji no celular)
const PIECE_SYMBOLS = {
  w:{k:'♔\uFE0E',q:'♕\uFE0E',r:'♖\uFE0E',b:'♗\uFE0E',n:'♘\uFE0E',p:'♙\uFE0E'},
  b:{k:'♚\uFE0E',q:'♛\uFE0E',r:'♜\uFE0E',b:'♝\uFE0E',n:'♞\uFE0E',p:'♟\uFE0E'}
};

// --- ÁUDIO ---
let audioCtx;
const SND = {
  move:['sine',300,150,.08,.15], p:['sawtooth',900,120,.18,.35], n:['square',180,40,.35,.45],
  b:['sine',1400,300,.45,.4], r:['triangle',110,15,.6,.8], q:['sawtooth',1000,80,.5,.45], k:['square',250,25,.65,.6], clink:['triangle',2400,900,.22,.25], thud:['sine',150,25,.6,.9], win:['triangle',400,1200,.9,.3]
};
function playSound(type){
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const [wave,f1,f2,d,g] = SND[type], now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = wave; osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.setValueAtTime(f1, now);
  osc.frequency.exponentialRampToValueAtTime(f2, now + d);
  gain.gain.setValueAtTime(g, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + d);
  osc.start(now); osc.stop(now + d);
}

// --- COORDENADAS ---
function sqToXY(sq){
  const col = files.indexOf(sq[0]), row = 8 - parseInt(sq[1]);
  return {x: col*SQ_SIZE + SQ_SIZE/2, y: row*SQ_SIZE + SQ_SIZE/2};
}
function xyToSq(x, y){
  const col = Math.floor(x/SQ_SIZE), row = Math.floor(y/SQ_SIZE);
  return (col<0||col>7||row<0||row>7) ? null : files[col] + (8-row);
}

// --- EFEITOS GERAIS ---
const triggerShake = (duration, intensity) => { shakeTime = duration; shakeIntensity = intensity; };
const triggerFlash = (color, alpha=.6) => { screenFlash = {color, alpha}; };
function spawnParticles(x, y, color, count, speed=6, size=4){
  for (let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, v = (Math.random()*.7+.3)*speed;
    particles.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, color, size:Math.random()*size+2, life:1, decay:Math.random()*.03+.02});
  }
}

// --- ANIMAÇÕES ---
let fxs = [], decals = [], ghosts = [], hitStop = 0, punch = 0, punchX = 320, punchY = 320, mate = null;
const ring = (x,y,c,max=90,life=26,w=6) => fxs.push({k:'ring',x,y,c,max,life,l:life,w});
const glow = (x,y,c,max=120,life=20) => fxs.push({k:'glow',x,y,c,max,life,l:life});
const rise = (x,y,c,n) => { for (let i=0;i<n;i++) particles.push({x:x+(Math.random()-.5)*40,y:y+20,vx:(Math.random()-.5)*.6,vy:-(1+Math.random()*3),color:c,size:2+Math.random()*3,life:1,decay:.02}); };
const trail = () => ghosts.push({x:movingPiece.x,y:movingPiece.y,t:movingPiece.type,c:movingPiece.color,l:12});
function crack(x,y,c){
  const ls = [];
  for (let i=0;i<8;i++){
    let a = Math.random()*6.28, px = 0, py = 0; const pts = [[0,0]];
    for (let j=0;j<4;j++){ a += (Math.random()-.5)*.9; const d = 10+Math.random()*14; px += Math.cos(a)*d; py += Math.sin(a)*d; pts.push([px,py]); }
    ls.push(pts);
  }
  decals.push({x,y,c,l:300,ls});
}
function drawDecals(){
  for (let i=decals.length-1;i>=0;i--){
    const d = decals[i];
    if (--d.l <= 0){ decals.splice(i,1); continue; }
    ctx.save(); ctx.translate(d.x,d.y); ctx.globalAlpha = Math.min(1,d.l/120)*.8;
    const g = ctx.createRadialGradient(0,0,2,0,0,34);
    g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(-34,-34,68,68);
    ctx.strokeStyle = d.c; ctx.lineWidth = 1.5; ctx.shadowBlur = 8; ctx.shadowColor = d.c;
    d.ls.forEach(p => { ctx.beginPath(); p.forEach((q,j) => j ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1])); ctx.stroke(); });
    ctx.restore();
  }
}
function drawFx(){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i=fxs.length-1;i>=0;i--){
    const f = fxs[i];
    if (--f.l < 0){ fxs.splice(i,1); continue; }
    const k = 1 - f.l/f.life;
    if (f.k === 'ring'){
      ctx.strokeStyle = f.c; ctx.globalAlpha = 1-k; ctx.lineWidth = f.w*(1-k)+1; ctx.shadowBlur = 18; ctx.shadowColor = f.c;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.max*Math.sqrt(k),0,6.283); ctx.stroke();
    } else {
      const r = f.max*(.4+.6*k), g = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
      g.addColorStop(0,f.c); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha = (1-k)*.8; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x,f.y,r,0,6.283); ctx.fill();
    }
  }
  ctx.restore();
  for (let i=ghosts.length-1;i>=0;i--){
    const g = ghosts[i];
    if (--g.l <= 0){ ghosts.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = g.l/12*.35; drawPieceIcon(g.t,g.c,g.x,g.y); ctx.restore();
  }
}
function camera(){
  if (punch > .002){ ctx.translate(punchX,punchY); ctx.scale(1+punch,1+punch); ctx.translate(-punchX,-punchY); punch *= .86; }
  if (mate){
    const e = Math.min(1,mate.t/60), s = e*e*(3-2*e), fx = 320+(mate.kx-320)*s, fy = 320+(mate.ky-320)*s;
    ctx.translate(320,320); ctx.scale(1+.9*s,1+.9*s); ctx.translate(-fx,-fy);
  }
}
function drawVictim(){
  const m = movingPiece;
  if (!m.victim || m.victimAlpha <= 0) return;
  if (m.dying) m.victimAlpha = Math.max(0, m.victimAlpha-.09);
  const d = 1 - m.victimAlpha;
  ctx.save(); ctx.globalAlpha = m.victimAlpha;
  ctx.translate(m.victimX, m.victimY - (m.lift ? d*70 : 0));
  ctx.rotate(d*(m.spin||.6)); ctx.scale(1+d*.3, m.crush ? 1-d*.7 : 1+d*.3);
  drawPieceIcon(m.victim.type, m.victim.color, 0, 0);
  ctx.restore();
}
function hit(ef,o){
  ef.hitTriggered = true; playSound(o.s); triggerShake(o.sh,o.si); triggerFlash(o.c,o.fl);
  spawnParticles(ef.endX,ef.endY,o.c,o.n,o.sp,5); spawnParticles(ef.endX,ef.endY,'#ffffff',10,o.sp+2,3);
  movingPiece.dying = true; hitStop = o.st||0; punch = o.pu||.05; punchX = ef.endX; punchY = ef.endY;
  ring(ef.endX,ef.endY,o.c,o.r||90); glow(ef.endX,ef.endY,o.c,130);
}
function cut(x1,y1,x2,y2,k,c,a){
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round';
  const ex = x1+(x2-x1)*k, ey = y1+(y2-y1)*k;
  ctx.strokeStyle = c; ctx.lineWidth = 11; ctx.shadowBlur = 22; ctx.shadowColor = c;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.shadowBlur = 0; ctx.stroke(); ctx.restore();
}
function bolt(x1,y1,x2,y2,c,w){
  ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.shadowBlur = 20; ctx.shadowColor = c;
  ctx.beginPath(); ctx.moveTo(x1,y1);
  for (let i=1;i<6;i++){ const k = i/6; ctx.lineTo(x1+(x2-x1)*k+(Math.random()-.5)*34, y1+(y2-y1)*k+(Math.random()-.5)*34); }
  ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}

function startEffect(type,color,from,to,victim,victimSq,onComplete,duration){
  isAnimating = true;
  const s = sqToXY(from), e = sqToXY(to), v = victimSq ? sqToXY(victimSq) : e;
  movingPiece = {type,color,x:s.x,y:s.y,destSq:to,victim,victimX:v.x,victimY:v.y,victimAlpha:1,dying:false};
  activeEffects.push({type,startX:s.x,startY:s.y,endX:e.x,endY:e.y,progress:0,duration,hitTriggered:false,onComplete});
}
function playCaptureAnimation(type,color,from,to,victim,victimSq,onComplete){
  startEffect(type,color,from,to,victim,victimSq,onComplete,{p:50,n:50,b:60,r:62,q:64,k:66}[type]);
}
function playSlide(type,color,from,to,onComplete){
  playSound('move'); startEffect('move',color,from,to,null,null,onComplete,14); movingPiece.type = type;
}
const lerpPiece = (ef,k) => { movingPiece.x = ef.startX+(ef.endX-ef.startX)*k; movingPiece.y = ef.startY+(ef.endY-ef.startY)*k; };

function updateAndDrawEffects(){
  for (let i=activeEffects.length-1;i>=0;i--){
    const ef = activeEffects[i];
    if (hitStop <= 0) ef.progress++;
    const t = Math.min(1,ef.progress/ef.duration), X = ef.endX, Y = ef.endY, m = movingPiece;
    ctx.save();
    if (ef.type === 'move'){ lerpPiece(ef, t*t*(3-2*t)); }
    // PEÃO: investida com rastro + corte em X
    else if (ef.type === 'p'){
      lerpPiece(ef, Math.pow(Math.min(1,t*2),2)); if (t < .5) trail();
      if (t >= .45 && !ef.hitTriggered) hit(ef,{s:'p',sh:10,si:9,c:'#00f2fe',fl:.4,n:28,sp:8,st:4,pu:.04,r:70});
      if (t >= .4 && t <= .85){
        const p = (t-.4)/.45, a = 1-p*p;
        cut(X-40,Y-40,X+40,Y+40,Math.min(1,p*2.5),'#00f2fe',a);
        cut(X+40,Y-40,X-40,Y+40,Math.min(1,Math.max(0,p*2.5-.6)),'#00f2fe',a);
      }
    }
    // CAVALO: salto com sombra, fogo, pouso com rachaduras
    else if (ef.type === 'n'){
      const e = Math.min(1,t/.6), gx = ef.startX+(X-ef.startX)*e, gy = ef.startY+(Y-ef.startY)*e, h = Math.sin(e*Math.PI)*60;
      m.x = gx; m.y = gy-h;
      if (t < .6){
        ctx.fillStyle = `rgba(0,0,0,${.35*(1-h/90)})`;
        ctx.beginPath(); ctx.ellipse(gx,gy+24,24-h*.15,8-h*.05,0,0,6.283); ctx.fill();
        spawnParticles(m.x,m.y+10,'#ff6b00',3,2,5); trail();
      }
      if (t >= .6 && !ef.hitTriggered){
        hit(ef,{s:'n',sh:16,si:13,c:'#ff6b00',fl:.5,n:40,sp:9,st:5,pu:.07,r:110});
        crack(X,Y,'#ff9f1a'); ring(X,Y,'#ffd27a',60,20,3); spawnParticles(X,Y+20,'#c9a46a',25,6,5); m.crush = true;
      }
    }
    // BISPO: círculos arcanos + pilar de luz, vítima flutua e some
    else if (ef.type === 'b'){
      const s = Math.min(1,t*3);
      ctx.save(); ctx.translate(X,Y); ctx.globalAlpha = t > .85 ? (1-t)/.15 : 1;
      ctx.strokeStyle = '#00a8ff'; ctx.lineWidth = 3; ctx.shadowBlur = 20; ctx.shadowColor = '#00a8ff';
      ctx.save(); ctx.rotate(t*Math.PI*4); ctx.beginPath(); ctx.arc(0,0,38*s,0,6.283); ctx.stroke(); ctx.strokeRect(-26*s,-26*s,52*s,52*s); ctx.restore();
      ctx.save(); ctx.rotate(-t*Math.PI*3); ctx.beginPath(); ctx.arc(0,0,22*s,0,6.283); ctx.stroke(); ctx.strokeRect(-16*s,-16*s,32*s,32*s); ctx.restore();
      ctx.restore();
      if (t <= .7) m.y = ef.startY - 8*Math.sin(Math.min(1,t/.5)*Math.PI);
      if (t >= .5 && !ef.hitTriggered){ hit(ef,{s:'b',sh:14,si:10,c:'#00a8ff',fl:.6,n:30,sp:5,st:3,pu:.04,r:80}); m.lift = true; m.spin = .3; }
      if (t >= .5 && t <= .85){
        const bw = 45*Math.sin(((t-.5)/.35)*Math.PI), g = ctx.createLinearGradient(X-bw,0,X+bw,0);
        g.addColorStop(0,'rgba(0,168,255,0)'); g.addColorStop(.5,'rgba(255,255,255,.95)'); g.addColorStop(1,'rgba(0,168,255,0)');
        ctx.fillStyle = g; ctx.fillRect(X-bw,0,bw*2,Y+20);
        ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(X-bw*.2,0,bw*.4,Y+20);
        rise(X,Y,'#9ee7ff',3);
      }
      if (t > .7) lerpPiece(ef,(t-.7)/.3);
    }
    // TORRE: carga, recuo, bala de canhão com fumaça, explosão
    else if (ef.type === 'r'){
      const dx = X-ef.startX, dy = Y-ef.startY, L = Math.hypot(dx,dy)||1;
      if (t < .3 && ef.progress%4 === 0) glow(ef.startX,ef.startY,'#ff6b00',40+t*150,8);
      if (t < .72){ const rc = (t>.3 && t<.45) ? Math.sin((t-.3)/.15*Math.PI)*14 : 0; m.x = ef.startX-dx/L*rc; m.y = ef.startY-dy/L*rc; }
      if (t >= .3 && t < .55){
        const k = Math.pow((t-.3)/.25,1.6), px = ef.startX+dx*k, py = ef.startY+dy*k;
        const g = ctx.createRadialGradient(px,py,1,px,py,18);
        g.addColorStop(0,'#fff'); g.addColorStop(.4,'#ffa801'); g.addColorStop(1,'rgba(255,63,52,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px,py,18,0,6.283); ctx.fill();
        spawnParticles(px,py,'#ffa801',2,2); spawnParticles(px,py,'#777777',1,1.2,5);
      }
      if (t >= .55 && !ef.hitTriggered){
        hit(ef,{s:'r',sh:24,si:20,c:'#ff3f34',fl:.7,n:55,sp:11,st:7,pu:.09,r:140});
        spawnParticles(X,Y,'#ffdd59',30,8,4); glow(X,Y,'#ffb142',170,26); crack(X,Y,'#ff3f34');
      }
      if (t > .72) lerpPiece(ef,(t-.72)/.28);
    }
    // RAINHA: dash com rastro, círculo arcano, tempestade de raios
    else if (ef.type === 'q'){
      lerpPiece(ef,Math.min(1,t*1.8)); if (t < .55) trail();
      if (t >= .45 && !ef.hitTriggered){ hit(ef,{s:'q',sh:22,si:16,c:'#be2edd',fl:.65,n:60,sp:10,st:6,pu:.08,r:120}); crack(X,Y,'#e056fd'); }
      if (t >= .3 && t <= .9){
        ctx.save(); ctx.translate(X,Y); ctx.rotate(t*8); ctx.strokeStyle = '#e056fd'; ctx.lineWidth = 2; ctx.shadowBlur = 15; ctx.shadowColor = '#be2edd';
        ctx.beginPath(); ctx.arc(0,0,48,0,6.283);
        for (let a=0;a<8;a++){ ctx.moveTo(0,0); ctx.lineTo(Math.cos(a*.785)*48,Math.sin(a*.785)*48); }
        ctx.stroke(); ctx.restore();
      }
      if (t >= .4 && t <= .9){
        bolt(X+(Math.random()-.5)*50,-10,X,Y,'#e056fd',4);
        for (let b=0;b<3;b++){ const a = Math.random()*6.283; bolt(X,Y,X+Math.cos(a)*70,Y+Math.sin(a)*70,'#f5b7ff',2); }
      }
    }
    // REI: sombra crescente, espada colossal, impacto devastador
    else if (ef.type === 'k'){
      const d = Math.pow(Math.min(1,t/.5),2.2);
      if (t < .5){
        ctx.fillStyle = `rgba(0,0,0,${.45*d})`; ctx.beginPath(); ctx.ellipse(X,Y+24,10+34*d,5+12*d,0,0,6.283); ctx.fill();
        glow(X,Y,'#f1c40f',50+60*d,3);
      }
      drawGiantSword(X, t < .5 ? Y-300*(1-d) : Y, t > .8 ? (1-t)/.2 : 1);
      if (t >= .5 && !ef.hitTriggered){
        hit(ef,{s:'k',sh:30,si:24,c:'#f1c40f',fl:.8,n:65,sp:12,st:8,pu:.1,r:150});
        ring(X,Y,'#ff9f1a',110,34,5); ring(X,Y,'#fff3b0',60,18,3); crack(X,Y,'#f1c40f'); m.crush = true;
      }
      if (t > .68) lerpPiece(ef,(t-.68)/.32);
    }
    ctx.restore();
    if (ef.progress >= ef.duration){
      activeEffects.splice(i,1); movingPiece = null; isAnimating = false; ef.onComplete();
    }
  }
}
function drawGiantSword(x,y,a=1){
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x,y); ctx.shadowBlur = 30; ctx.shadowColor = '#f1c40f';
  const g = ctx.createLinearGradient(-12,0,12,0);
  g.addColorStop(0,'#bdc3c7'); g.addColorStop(.5,'#ffffff'); g.addColorStop(1,'#95a5a6');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(-12,-90); ctx.lineTo(12,-90); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f1c40f'; ctx.fillRect(-30,-95,60,10); ctx.fillRect(-6,-125,12,30);
  ctx.beginPath(); ctx.arc(0,-130,7,0,6.283); ctx.fill(); ctx.restore();
}

// --- XEQUE-MATE: a coroa do rei caído ---
function startMate(){
  const L = game.turn(), b = game.board(); let sq = null;
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){ const p = b[r][c]; if (p && p.type==='k' && p.color===L) sq = files[c]+(8-r); }
  const p = sqToXY(sq);
  mate = {t:0, sq, c:L, kx:p.x, ky:p.y, dir:Math.random()<.5?-1:1, crown:null};
}
function drawCrown(x,y,s,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s); ctx.shadowColor = '#ffcc33'; ctx.shadowBlur = 18;
  const g = ctx.createLinearGradient(0,-24,0,16);
  g.addColorStop(0,'#fff3b0'); g.addColorStop(.5,'#f1c40f'); g.addColorStop(1,'#a8740a');
  ctx.fillStyle = g; ctx.strokeStyle = '#6b4a05'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-26,12); ctx.lineTo(-30,-16); ctx.lineTo(-14,-2); ctx.lineTo(0,-24); ctx.lineTo(14,-2); ctx.lineTo(30,-16); ctx.lineTo(26,12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = '#8a5a06'; ctx.fillRect(-26,6,52,9);
  [[-16,'#e74c3c'],[0,'#3498db'],[16,'#e74c3c']].forEach(([gx,c]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(gx,10.5,3.2,0,6.283); ctx.fill(); });
  ctx.fillStyle = '#fff'; [[-30,-16],[0,-24],[30,-16]].forEach(([px,py]) => { ctx.beginPath(); ctx.arc(px,py,2.6,0,6.283); ctx.fill(); });
  ctx.restore();
}
function mateWorld(){
  if (mate.t >= 300 && !mateReplayed){ startReplay(); return; }
  const m = mate, t = m.t++, kx = m.kx, ky = m.ky, e = Math.min(1,t/50);
  const vg = ctx.createRadialGradient(kx,ky,40,kx,ky,200);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,`rgba(0,0,12,${.9*e})`);
  ctx.fillStyle = vg; ctx.fillRect(-400,-400,1440,1440);
  if (t < 100 && t%25 === 5) ring(kx,ky,'#ff3344',70,25,4);
  if (t === 100){
    const ix = kx+m.dir*30, iy = ky+30;
    playSound('thud'); triggerShake(26,22); triggerFlash('#ffd24a',.55); hitStop = 6; punch = .08; punchX = ix; punchY = iy;
    ring(ix,iy,'#ffd24a',130,34,7); ring(ix,iy,'#ff3344',90,26,4); glow(ix,iy,'#ffd24a',140,24); crack(ix,iy,'#ffd24a');
    spawnParticles(ix,iy-2,'#c9a46a',40,7,5);
    m.crown = {x:kx+m.dir*26, y:ky+6, vx:m.dir*2.4, vy:-9.5, rot:0, vr:m.dir*.22, rest:false, restT:0};
  }
  const c = m.crown, fl = ky+24;
  if (c && !c.rest){
    c.vy += .55; c.x += c.vx; c.y += c.vy; c.rot += c.vr;
    if (c.y >= fl){
      c.y = fl;
      if (Math.abs(c.vy) > 2.2){
        c.vy *= -.55; c.vx *= .7; c.vr *= .7;
        playSound('clink'); spawnParticles(c.x,c.y,'#fff3b0',12,5,3); ring(c.x,c.y,'#ffd24a',40,16,3); glow(c.x,c.y,'#ffd24a',70,14);
      } else {
        c.rest = true; c.restT = t; playSound('win');
        c.rot = ((c.rot%6.283)+6.283)%6.283; if (c.rot > 3.1416) c.rot -= 6.283;
      }
    }
  } else if (c) c.rot += (m.dir*.3-c.rot)*.12;
  // luzes: raios, cone de luz, brilho, estrelas
  if (c && c.rest){
    const l = Math.min(1,(t-c.restT)/45);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,280);
    rg.addColorStop(0,'rgba(255,214,90,.35)'); rg.addColorStop(1,'rgba(255,214,90,0)'); ctx.fillStyle = rg;
    for (let i=0;i<14;i++){
      const a = i*.4488+t*.004;
      ctx.globalAlpha = l*(.55+.45*Math.sin(t*.05+i));
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.arc(c.x,c.y,280,a-.09,a+.09); ctx.closePath(); ctx.fill();
    }
    const lg = ctx.createLinearGradient(0,c.y-260,0,c.y+34);
    lg.addColorStop(0,'rgba(255,240,180,0)'); lg.addColorStop(1,'rgba(255,240,180,.4)');
    ctx.globalAlpha = l; ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(c.x-14,c.y-260); ctx.lineTo(c.x+14,c.y-260); ctx.lineTo(c.x+85,c.y+34); ctx.lineTo(c.x-85,c.y+34); ctx.closePath(); ctx.fill();
    const pr = 75+10*Math.sin(t*.08), pg = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,pr);
    pg.addColorStop(0,'rgba(255,225,120,.55)'); pg.addColorStop(1,'rgba(255,225,120,0)');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(c.x,c.y,pr,0,6.283); ctx.fill();
    ctx.fillStyle = '#fff7c2';
    for (let i=0;i<10;i++){
      const a = i*2.4+t*.01, r = 24+(i%4)*10, x = c.x+Math.cos(a)*r*1.4, y = c.y+Math.sin(a)*r*.8;
      const s = Math.max(0,Math.sin(t*.08+i*1.7))*(4+3.5*(i%3));
      if (s < .5) continue;
      ctx.globalAlpha = l; ctx.beginPath();
      ctx.moveTo(x,y-s); ctx.lineTo(x+s*.18,y-s*.18); ctx.lineTo(x+s,y); ctx.lineTo(x+s*.18,y+s*.18);
      ctx.lineTo(x,y+s); ctx.lineTo(x-s*.18,y+s*.18); ctx.lineTo(x-s,y); ctx.lineTo(x-s*.18,y-s*.18); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    if (t%3 === 0) particles.push({x:c.x+(Math.random()-.5)*70,y:c.y+Math.random()*10,vx:(Math.random()-.5)*.4,vy:-.4-Math.random()*.8,color:'#ffd24a',size:1.5+Math.random()*2,life:1,decay:.008});
  }
  // rei tombando
  const f = Math.min(1,Math.max(0,(t-45)/55)), wob = t > 100 ? m.dir*.07*Math.sin((t-100)*.5)*Math.exp(-(t-100)*.08) : 0;
  ctx.save(); ctx.translate(kx+(t<45 ? Math.sin(t*1.8)*(t/45)*3 : 0), ky+30);
  ctx.rotate(m.dir*1.5708*f*f*f+wob); ctx.translate(0,-30); ctx.globalAlpha = .92; drawPieceIcon('k',m.c,0,0); ctx.restore();
  // coroa
  if (c){
    const hgt = Math.max(0,fl-c.y);
    ctx.fillStyle = `rgba(0,0,0,${.4*(1-Math.min(1,hgt/120))})`;
    ctx.beginPath(); ctx.ellipse(c.x,ky+38,Math.max(8,26-hgt*.1),7,0,0,6.283); ctx.fill();
    drawCrown(c.x,c.y,1.25,c.rot);
  }
}
function mateUI(){
  const m = mate, t = m.t;
  if (t < 150) return;
  const p = Math.min(1,(t-150)/40), win = m.c === 'w' ? 'Pretas' : 'Brancas';
  ctx.save(); ctx.textAlign = 'center'; ctx.globalAlpha = p;
  const g = ctx.createLinearGradient(0,0,0,170);
  g.addColorStop(0,'rgba(0,0,0,.75)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0,0,640,170);
  ctx.font = 'bold 54px Georgia,serif'; if ('letterSpacing' in ctx) ctx.letterSpacing = '4px';
  ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 24+8*Math.sin(t*.08);
  const tg = ctx.createLinearGradient(0,40,0,100); tg.addColorStop(0,'#fff7c2'); tg.addColorStop(1,'#e6a817');
  ctx.fillStyle = tg; ctx.fillText('XEQUE-MATE',320,88);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  ctx.font = '22px Georgia,serif'; ctx.shadowBlur = 10; ctx.fillStyle = '#fff'; ctx.fillText(`${win} vencem!`,320,126);
  if (t > 240){
    ctx.globalAlpha = .5+.5*Math.sin(t*.06); ctx.font = '15px Segoe UI,sans-serif'; ctx.shadowBlur = 0; ctx.fillStyle = '#ccc';
    ctx.fillText(mateReplayed ? 'Toque no tabuleiro para jogar de novo' : 'Replay da partida em instantes (toque para ver agora)',320,620);
  }
  ctx.restore();
}

// --- REPLAY AUTOMÁTICO DA PARTIDA ---
let replay = null, mateReplayed = false, finalFen = null;
function startReplay(){
  const hist = game.history({verbose:true});
  finalFen = game.fen();
  mate = null; activeEffects = []; movingPiece = null; isAnimating = false;
  fxs = []; decals = []; ghosts = []; particles = []; hitStop = 0; punch = 0; selectedSq = null; validMoves = [];
  game.reset();
  replay = {i:0, moves:hist, wait:60};
  triggerFlash('#ffffff',.5);
  const el = document.getElementById('status'); el.innerText = '🎬 Replay da partida'; el.style.color = '#ff6b81';
}
function stepReplay(){
  if (!replay || isAnimating) return;
  if (replay.wait > 0){ replay.wait--; return; }
  if (replay.i >= replay.moves.length){ endReplay(); return; }
  const h = replay.moves[replay.i++], before = game.get(h.to);
  const mv = game.move({from:h.from, to:h.to, promotion:h.promotion || 'q'});
  if (!mv){ endReplay(); return; }
  replay.wait = replay.i >= replay.moves.length ? 70 : (mv.captured ? 30 : 16);
  if (mv.captured){
    const ep = mv.flags.includes('e'), vsq = ep ? mv.to[0]+mv.from[1] : mv.to;
    const victim = ep ? {type:'p', color: mv.color==='w'?'b':'w'} : before;
    playCaptureAnimation(mv.piece, mv.color, mv.from, mv.to, victim, vsq, () => {});
  } else playSlide(mv.piece, mv.color, mv.from, mv.to, () => {});
}
function endReplay(){
  if (!replay) return;
  replay = null; mateReplayed = true;
  activeEffects = []; movingPiece = null; isAnimating = false; fxs = []; decals = []; ghosts = []; hitStop = 0; punch = 0;
  game.load(finalFen); triggerFlash('#ffffff',.6); updateStatus();
}
function replayUI(){
  const r = replay; ctx.save();
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,640,26); ctx.fillRect(0,614,640,26);
  ctx.font = 'bold 15px Segoe UI,sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = Math.floor(performance.now()/500)%2 ? '#ff3344' : '#7a1a22';
  ctx.beginPath(); ctx.arc(16,13,5,0,6.283); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText('REPLAY',28,18);
  ctx.textAlign = 'right'; ctx.fillText(`${Math.min(r.i,r.moves.length)}/${r.moves.length}`,626,18);
  ctx.textAlign = 'center'; ctx.font = '12px Segoe UI,sans-serif'; ctx.fillStyle = '#aaa'; ctx.fillText('Toque para pular',320,631);
  ctx.restore();
}

// --- RENDER ---
function drawPieceIcon(type, color, x, y){
  ctx.save();
  ctx.font = '56px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowBlur = 12;
  const ch = PIECE_SYMBOLS[color][type];
  if (color === 'w'){
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,168,255,.8)';
  } else {
    ctx.fillStyle = '#1e272e'; ctx.shadowColor = 'rgba(231,76,60,.9)';
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2; ctx.strokeText(ch, x, y+3);
  }
  ctx.fillText(ch, x, y+3);
  ctx.restore();
}
function drawBoard(){
  ctx.clearRect(0,0,640,640);
  ctx.save();
  camera();
  if (shakeTime > 0){
    ctx.translate((Math.random()-.5)*shakeIntensity, (Math.random()-.5)*shakeIntensity);
    shakeTime--;
  }
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){
    const sq = files[c] + (8-r), x = c*SQ_SIZE, y = r*SQ_SIZE;
    ctx.fillStyle = (r+c)%2===0 ? '#3b4252' : '#242933';
    ctx.fillRect(x,y,SQ_SIZE,SQ_SIZE);
    if (selectedSq === sq){ ctx.fillStyle = 'rgba(241,196,15,.35)'; ctx.fillRect(x,y,SQ_SIZE,SQ_SIZE); }
    const mv = validMoves.find(m => m.to === sq);
    if (mv){
      if (mv.captured){
        ctx.fillStyle = 'rgba(231,76,60,.45)'; ctx.fillRect(x,y,SQ_SIZE,SQ_SIZE);
        ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 3; ctx.strokeRect(x+2,y+2,SQ_SIZE-4,SQ_SIZE-4);
      } else {
        ctx.fillStyle = 'rgba(46,204,113,.6)'; ctx.beginPath(); ctx.arc(x+SQ_SIZE/2,y+SQ_SIZE/2,12,0,Math.PI*2); ctx.fill();
      }
    }
  }
  drawDecals();
  const board = game.board();
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){
    const p = board[r][c];
    if (!p) continue;
    if (movingPiece && files[c]+(8-r) === movingPiece.destSq) continue;
    if (mate && files[c]+(8-r) === mate.sq) continue; // peça animada
    drawPieceIcon(p.type, p.color, c*SQ_SIZE+SQ_SIZE/2, r*SQ_SIZE+SQ_SIZE/2);
  }
  if (movingPiece){
    drawVictim();
    drawPieceIcon(movingPiece.type, movingPiece.color, movingPiece.x, movingPiece.y);
  }
  updateAndDrawEffects();
  drawFx();
  if (hitStop > 0) hitStop--;
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  if (screenFlash.alpha > 0){
    ctx.save(); ctx.fillStyle = screenFlash.color; ctx.globalAlpha = screenFlash.alpha;
    ctx.fillRect(-20,-20,canvas.width+40,canvas.height+40); ctx.restore();
    screenFlash.alpha -= .04;
  }
  if (mate) mateWorld();
  ctx.restore();
  if (mate) mateUI();
  if (replay) replayUI();
  stepReplay();
  requestAnimationFrame(drawBoard);
}

// --- CLIQUE E BOT ---
canvas.addEventListener('click', e => {
  if (replay){ endReplay(); return; }
  if (mate && mate.t > 150 && !mateReplayed){ startReplay(); return; }
  if (mate && mate.t > 240){ resetGame(); return; }
  if (isAnimating || game.game_over()) return;
  if (vsBot && game.turn() === 'b') return;
  const rect = canvas.getBoundingClientRect();
  const sq = xyToSq((e.clientX-rect.left)*canvas.width/rect.width, (e.clientY-rect.top)*canvas.height/rect.height);
  if (!sq) return;
  if (selectedSq && validMoves.find(m => m.to === sq)){
    const from = selectedSq;
    selectedSq = null; validMoves = [];
    executeMove(from, sq);
    return;
  }
  const piece = game.get(sq);
  if (piece && piece.color === game.turn()){
    selectedSq = sq; validMoves = game.moves({square:sq, verbose:true});
  } else { selectedSq = null; validMoves = []; }
});

function executeMove(from, to){
  const before = game.get(to);
  const mv = game.move({from, to, promotion:'q'});
  if (!mv) return;
  const done = () => { updateStatus(); checkBotTurn(); };
  if (mv.captured){
    const ep = mv.flags.includes('e');
    const victimSq = ep ? to[0]+from[1] : to;
    const victim = ep ? {type:'p', color: mv.color==='w'?'b':'w'} : before;
    playCaptureAnimation(mv.piece, mv.color, from, to, victim, victimSq, done);
  } else playSlide(mv.piece, mv.color, from, to, done);
  updateStatus();
}
function checkBotTurn(){
  if (vsBot && game.turn() === 'b' && !game.game_over()){
    clearTimeout(botTimer);
    botTimer = setTimeout(() => {
      const moves = game.moves({verbose:true});
      if (!moves.length) return;
      const caps = moves.filter(m => m.captured); // prioriza capturas: mais animações!
      const pool = caps.length ? caps : moves;
      const m = pool[Math.floor(Math.random()*pool.length)];
      executeMove(m.from, m.to);
    }, 450);
  }
}
function updateStatus(){
  const el = document.getElementById('status');
  if (game.in_checkmate()){ el.innerText = '🏆 XEQUE-MATE! Fim de jogo.'; el.style.color = '#e74c3c'; if (!mate && !isAnimating) startMate(); }
  else if (game.in_draw()){ el.innerText = '🤝 EMPATE!'; el.style.color = '#f39c12'; }
  else {
    const turn = game.turn()==='w' ? 'Brancas' : 'Negras';
    el.innerText = `Vez das ${turn}` + (game.in_check() ? ' ⚠️ (XEQUE!)' : '');
    el.style.color = game.turn()==='w' ? '#2ecc71' : '#e67e22';
  }
}
function toggleMode(){
  vsBot = !vsBot;
  document.getElementById('modeBtn').innerText = vsBot ? 'Modo: Vs. Bot (IA)' : 'Modo: 2 Jogadores';
  resetGame();
}
function resetGame(){
  clearTimeout(botTimer);
  game.reset(); selectedSq = null; validMoves = []; activeEffects = []; particles = [];
  movingPiece = null; isAnimating = false; mate = null; replay = null; mateReplayed = false; fxs = []; decals = []; ghosts = []; hitStop = 0; punch = 0; updateStatus();
}
drawBoard();
</script>
